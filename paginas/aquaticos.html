
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Esportivo - Esportes Aquáticos</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <h1>Radar <span>Esportivo</span></h1>
        </div>

        <ul class="nav-links">
            <li><a href="../index.html">Página Inicial</a></li>
            <li><a href="aquaticos.html" class="ativo">Esportes Aquáticos</a></li>
            <li><a href="ciclismo.html">Ciclismo</a></li>
            <li><a href="compras.html">Compras</a></li>
        </ul>
    </header>

    <main>
        <h2 class="titulo-secao">Notícias de Esportes Aquáticos</h2>

        <div id="grid-noticias" class="grid-noticias">
            <p style="color: var(--texto-secundario); text-align: center; grid-column: 1/-1;">
                Carregando notícias de esportes aquáticos...
            </p>
        </div>
    </main>

    <script>
        async function carregarNoticias() {
            const grid = document.getElementById('grid-noticias');

            try {
                const resposta = await fetch('http://localhost:5000/api/noticias');

                if (!resposta.ok) {
                    throw new Error("Erro na comunicação com a API.");
                }

                const noticias = await resposta.json();

                grid.innerHTML = '';

                if (!Array.isArray(noticias)) {
                    throw new Error("Formato de notícias inválido.");
                }

                if (noticias[0] && noticias[0].erro) {
                    throw new Error(noticias[0].erro);
                }

                // FILTRO DE ESPORTES AQUÁTICOS
                const noticiasFiltradas = noticias.filter(noticia => {
                    const titulo = (noticia.title || '').toLowerCase();

                    return titulo.includes("natação") ||
                           titulo.includes("surfe") ||
                           titulo.includes("água") ||
                           titulo.includes("piscina");
                });

                // VERIFICA SE EXISTEM NOTÍCIAS DO TEMA
                if (noticiasFiltradas.length === 0) {
                    grid.innerHTML = `
                        <p class="mensagem-erro">
                            Nenhuma notícia de esportes aquáticos encontrada no momento.
                        </p>
                    `;
                    return;
                }

                // EXIBE APENAS AS NOTÍCIAS FILTRADAS
                noticiasFiltradas.forEach(noticia => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    card.innerHTML = `
                        <span class="card-categoria">${noticia.category}</span>

                        <a href="${noticia.url}"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="card-titulo">
                            ${noticia.title}
                        </a>

                        <p class="card-resumo">${noticia.summary}</p>

                        <div class="card-rodape">
                            <span>Fonte: ${noticia.tags[0]}</span>
                            <span>${noticia.date}</span>
                        </div>
                    `;

                    grid.appendChild(card);
                });

            } catch (erro) {
                grid.innerHTML = `
                    <div class="mensagem-erro">
                        <strong>Falha ao carregar as notícias:</strong>
                        <p>Certifique-se de que o arquivo app.py está rodando no terminal.</p>
                        <p>Detalhe: ${erro.message}</p>
                    </div>
                `;
            }
        }

        window.onload = carregarNoticias;
    </script>

</body>
</html>
